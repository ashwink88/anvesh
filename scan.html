<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANVESH | Identity & Verification</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 20px; margin: 0; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; max-width: 380px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 20px; }
    label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: bold; display: block; margin-top: 10px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 4px; background: #0b1329; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #065f46; color: #34d399; margin-bottom: 12px; }
    .call-btn { background: #dc2626; text-decoration: none; display: block; text-align: center; color: #fff; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; }
    .info-val { font-size: 16px; font-weight: bold; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="badge">ANVESH SURAKSHA SYSTEM</div>
    <div id="loading">Connecting to Secure Cloud...</div>

    <div id="registerForm" style="display: none;">
      <h2>Register New Band</h2>
      <p style="font-size: 12px; color: #94a3b8; margin: 0 0 10px 0;">Link profile to this wristband.</p>
      
      <label>Band Identifier</label>
      <input type="text" id="uidDisplay" readonly>

      <label>Full Name</label>
      <input type="text" id="inName" placeholder="e.g. Aarav Sharma">

      <label>Age</label>
      <input type="number" id="inAge" placeholder="e.g. 14">

      <label>Emergency Parent Contact</label>
      <input type="tel" id="inPhone" placeholder="e.g. +91 98765 43210">

      <button onclick="saveDetails()">Link & Activate Band</button>
    </div>

    <div id="profileView" style="display: none;">
      <h2>Student Safety Card</h2>
      
      <label>Student Name</label>
      <div class="info-val" id="viewName"></div>

      <label>Age</label>
      <div class="info-val" id="viewAge"></div>

      <label>Band Identifier</label>
      <div class="info-val" id="viewUID" style="font-family: monospace; font-size: 14px; color: #38bdf8;"></div>

      <label>Emergency Phone</label>
      <div class="info-val" id="viewPhone" style="color: #f87171;"></div>

      <a class="call-btn" id="callLink" href="#">📞 Call Parent / Emergency</a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://anvesh-suraksha-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const bandUID = urlParams.get('id');

    if (!bandUID) {
      document.getElementById("mainCard").innerHTML = "<h3 style='color:#ef4444;'>Invalid QR: No Band ID Attached</h3>";
    } else {
      document.getElementById("uidDisplay").value = bandUID;
      checkBandStatus();
    }

    async function checkBandStatus() {
      const snap = await db.ref("bands/" + bandUID).get();
      document.getElementById("loading").style.display = "none";

      if (snap.exists()) {
        const data = snap.val();
        document.getElementById("profileView").style.display = "block";
        document.getElementById("viewName").innerText = data.name;
        document.getElementById("viewAge").innerText = data.age + " Years";
        document.getElementById("viewUID").innerText = bandUID;
        document.getElementById("viewPhone").innerText = data.phone;
        document.getElementById("callLink").href = "tel:" + data.phone;

        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              db.ref("live_events").push({
                type: "MOBILE_QR_LOOKUP",
                uid: bandUID,
                name: data.name,
                phone: data.phone,
                hasLocation: true,
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                accuracy: Math.round(pos.coords.accuracy) + "m",
                timestamp: new Date().toLocaleTimeString()
              });
            },
            () => {
              db.ref("live_events").push({
                type: "MOBILE_QR_LOOKUP",
                uid: bandUID,
                name: data.name,
                phone: data.phone,
                hasLocation: false,
                timestamp: new Date().toLocaleTimeString()
              });
            },
            { enableHighAccuracy: true, timeout: 8000 }
          );
        }
      } else {
        document.getElementById("registerForm").style.display = "block";
      }
    }

    async function saveDetails() {
      const name = document.getElementById("inName").value.trim();
      const age = document.getElementById("inAge").value.trim();
      const phone = document.getElementById("inPhone").value.trim();

      if (!name || !phone) return alert("Please fill in Name and Emergency Phone.");

      await db.ref("bands/" + bandUID).set({
        uid: bandUID,
        name: name,
        age: age,
        phone: phone,
        status: "SAFE",
        registeredAt: new Date().toLocaleTimeString()
      });

      await db.ref("live_events").push({
        type: "MOBILE_REGISTRATION",
        uid: bandUID,
        name: name,
        phone: phone,
        timestamp: new Date().toLocaleTimeString()
      });

      alert("Band linked successfully!");
      location.reload();
    }
  </script>
</body>
</html>
